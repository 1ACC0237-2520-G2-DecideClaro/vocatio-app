<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil | Vocatio</title>
  <link rel="stylesheet" href="../css/profile.css" />
</head>

<body>

<header>
    <div class="logo">
        <a href="dashboard.html">
            <img src="../assets/img/logo.png" alt="Vocatio logo">
        </a>
    </div>

    <nav>
        <a href="dashboard.html" class="active">Vista General</a>
        <a href="../pages/test.html" class="test-link">Iniciar Test</a>
        <a href="../pages/path.html">Ruta de Aprendizaje</a>
        <a href="../pages/explore.html">Explorar</a>
        <a href="../pages/reports.html">Informes</a>
    </nav>

</header>

  <main class="main-content">

    <section class="profile-section">
      <img id="perfil" src="../assets/img/perfil.png" alt="Foto de perfil">
      <h1 id="nombreUsuario">Usuario</h1>
    </section>

    <section class="content-grid">

      <div class="col-left">
        <h3 id="edit">Editar información personal</h3>

        <form class="profile-form" novalidate autocomplete="off">
          <input type="text" placeholder="Nombres" name="Nombre" class="formulario2" id="Nombre" autocomplete="off" />
          <input type="text" placeholder="Apellidos" name="Apellido" class="formulario2" id="Apellido" autocomplete="off" />

          <h3 id="cambiar">Cambiar contraseña</h3>
          <input type="password" placeholder="Contraseña" name="Contraseña" class="formulario" id="Contraseña" autocomplete="new-password" />
          <input type="password" placeholder="Nueva Contraseña" name="NuevaContraseña" class="formulario" id="NuevaContraseña" autocomplete="new-password" />
          <input type="password" placeholder="Confirmar nueva Contraseña" name="ConfirmarNuevaContraseña" class="formulario" id="ConfirmarNuevaContraseña" autocomplete="new-password" />
        </form>
      </div>

      <div class="separator" aria-hidden="true"></div>

      <div class="col-right">
        <h3 id="config">Configuración del Sistema</h3>

        <div class="language-block">
          <h4>Idioma</h4>
          <p>Predeterminado del sistema <br>
            <span class="lang">(Español (España))</span>
          </p>
        </div>

        <div class="delete-block">
          <input type="submit" value="ELIMINAR CUENTA" name="EliminarCuenta" id="EliminarCuenta" />
        </div>
      </div>

    </section>
  </main>

  <script src="../js/profile.js"></script>
</body>
</html>
